<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden – Cologne Salon Rockester</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --bg: #0d0a08; --text: #f0e8d8; --text-muted: #9a8e7e;
            --accent: #c9a84c; --border: rgba(201,168,76,0.15);
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Libre Baskerville', Georgia, serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text);
            font-family: var(--font-body); min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem; text-align: center;
        }
        .wrap { max-width: 520px; }
        .code {
            font-family: var(--font-display); font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 400; letter-spacing: 0.04em; line-height: 1;
            color: var(--accent); opacity: 0.25; margin-bottom: 1.5rem;
        }
        h1 {
            font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 400; letter-spacing: 0.06em; margin-bottom: 1rem;
        }
        p { color: var(--text-muted); font-style: italic; line-height: 1.8; margin-bottom: 2.5rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.6rem;
            font-family: var(--font-display); font-size: 0.85rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--accent); text-decoration: none;
            border: 1px solid var(--accent); padding: 0.7rem 1.8rem;
            transition: background 0.3s;
        }
        .btn:hover { background: rgba(201,168,76,0.1); }
        .quick-links {
            margin-top: 2rem; display: flex; flex-wrap: wrap;
            gap: 0.6rem; justify-content: center;
        }
        .quick-link {
            font-family: var(--font-display); font-size: 0.75rem;
            letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--text-muted); text-decoration: none;
            border: 1px solid var(--border); padding: 0.45rem 1rem;
            transition: color 0.3s, border-color 0.3s;
        }
        .quick-link:hover { color: var(--accent); border-color: var(--accent); }
        .redirect-note {
            margin-top: 2rem; font-size: 0.78rem;
            color: var(--text-muted); font-style: italic;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">404</div>
        <h1 id="wit-heading">Seite nicht gefunden</h1>
        <p id="wit-text">Diese Seite existiert nicht mehr. Du wirst in Kürze zur Startseite weitergeleitet.</p>
        <a href="/" class="btn">← Zur Startseite</a>
        <div class="quick-links">
            <a href="/#contact" class="quick-link">Booking</a>
            <a href="/#repertoire" class="quick-link">Repertoire</a>
            <a href="/downloads.html" class="quick-link">Downloads</a>
            <a href="/docs/pressetext.pdf" class="quick-link">Pressetext</a>
            <a href="/impressum.html" class="quick-link">Impressum</a>
        </div>
        <p class="redirect-note" id="countdown">Weiterleitung in 5 Sekunden…</p>
    </div>

    <script>
        /* Random wit on each load */
        (function () {
            var lines = [
                { h: 'Diese Seite steht nicht auf der Setlist.', p: 'Diese Seite hat sich aus dem Programm verabschiedet — aber die Show geht weiter.' },
                { h: 'Diese Seite hat die Band verlassen.', p: 'Manche Noten gehören einfach nicht zur Setlist.' },
                { h: 'Falsche Bühne.', p: 'Hier spielt heute Nacht niemand. Vielleicht war die Seite nie gebucht.' },
                { h: 'Diese Seite ist abgespielt.', p: 'Wie eine alte Schallplatte, die keiner mehr findet — aber die Musik spielt weiter.' }
            ];
            var pick = lines[Math.floor(Math.random() * lines.length)];
            document.getElementById('wit-heading').textContent = pick.h;
            document.getElementById('wit-text').textContent = pick.p;
        })();

        /* Smart redirect based on old Joomla query strings */
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || '';
            var dest = '/';

            if (id.indexOf('impressum') !== -1 || id === '4')      dest = '/impressum.html';
            else if (id.indexOf('datenschutz') !== -1 || id === '5') dest = '/datenschutz.html';
            else if (id.indexOf('kontakt') !== -1)                   dest = '/#contact';
            else if (id.indexOf('ueber') !== -1 || id.indexOf('about') !== -1) dest = '/#about';
            else if (id.indexOf('download') !== -1 || id.indexOf('medien') !== -1) dest = '/downloads.html';

            var sec = 5;
            var el = document.getElementById('countdown');
            var iv = setInterval(function () {
                sec--;
                if (sec <= 0) { clearInterval(iv); window.location.replace(dest); }
                else { el.textContent = 'Weiterleitung in ' + sec + ' Sekunden…'; }
            }, 1000);

            document.querySelector('.btn').href = dest;
        })();
    </script>
</body>
</html>
